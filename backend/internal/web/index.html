<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquamor | Pure Water Delivery Nairobi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-200 pb-6 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-600">Aquamor</h1>
                <p class="text-sm text-slate-600">Pure, reliable water refills & bottled packs in Nairobi</p>
            </div>
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">
                API Online (SQLite Connected)
            </span>
        </header>

        <!-- Main Content -->
        <div class="grid md:grid-cols-2 gap-8 mb-12">
            <!-- Product Catalog Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-800">Our Catalog</h2>
                <div id="product-list" class="space-y-4">
                    <p class="text-slate-500 text-sm">Loading products from Go backend...</p>
                </div>
            </div>

            <!-- Order Form Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-4 text-slate-800">Quick Order</h2>
                <form id="order-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="customer_name" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="John Kamau">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Phone Number</label>
                        <input type="text" id="customer_phone" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0712345678">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Estate / Area</label>
                            <input type="text" id="delivery_estate" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ngara / Parklands">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Product ID</label>
                            <input type="number" id="product_id" value="1" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Delivery Address</label>
                        <input type="text" id="delivery_address" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Street / Building name">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
                        Place Order (M-Pesa)
                    </button>
                </form>
                <div id="order-response" class="mt-4 text-sm hidden p-3 rounded-lg"></div>
            </div>
        </div>

        <!-- Orders Management Dashboard Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">Live Customer Orders</h2>
                <button onclick="loadOrders()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
                    Refresh Orders
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="border-b text-xs uppercase text-slate-500 bg-slate-50">
                            <th class="py-2.5 px-3">Order ID</th>
                            <th class="py-2.5 px-3">Customer</th>
                            <th class="py-2.5 px-3">Phone</th>
                            <th class="py-2.5 px-3">Estate / Address</th>
                            <th class="py-2.5 px-3">Total (KES)</th>
                            <th class="py-2.5 px-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="py-4 text-center text-slate-400">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Fetch and render products catalog
        async function loadProducts() {
            try {
                const res = await fetch('/api/v1/products');
                const products = await res.json();
                const container = document.getElementById('product-list');
                container.innerHTML = products.map(p => `
                    <div class="p-3 border rounded-xl flex justify-between items-center hover:bg-slate-50 transition">
                        <div>
                            <h3 class="font-semibold text-slate-800 text-sm">${p.name}</h3>
                            <p class="text-xs text-slate-500 uppercase">Category: ${p.category} | Vol: ${p.volume || 'N/A'}</p>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-blue-600 text-sm">KES ${p.price_swap || p.price_new_bottle}</span>
                            <p class="text-[10px] text-slate-400">ID: #${p.id}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // Fetch and render saved orders
        async function loadOrders() {
            try {
                const res = await fetch('/api/v1/orders/all');
                const orders = await res.json();
                const container = document.getElementById('orders-table-body');
                if (!orders || orders.length === 0) {
                    container.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-400">No orders placed yet.</td></tr>`;
                    return;
                }
                container.innerHTML = orders.map(o => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 px-3 font-semibold text-blue-600">#${o.id}</td>
                        <td class="py-3 px-3 font-medium text-slate-800">${o.customer_name}</td>
                        <td class="py-3 px-3 text-slate-600">${o.customer_phone}</td>
                        <td class="py-3 px-3 text-slate-600">${o.delivery_estate} (${o.delivery_address})</td>
                        <td class="py-3 px-3 font-bold text-slate-800">KES ${o.total_amount}</td>
                        <td class="py-3 px-3">
                            <span class="bg-amber-100 text-amber-800 text-[11px] font-medium px-2 py-0.5 rounded-full uppercase">
                                ${o.order_status}
                            </span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        // Handle order submission
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resBox = document.getElementById('order-response');
            
            const payload = {
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                delivery_estate: document.getElementById('delivery_estate').value,
                delivery_address: document.getElementById('delivery_address').value,
                items: [
                    {
                        product_id: parseInt(document.getElementById('product_id').value),
                        bottle_option: "swap",
                        quantity: 1,
                        unit_price: 200.00
                    }
                ]
            };

            try {
                const response = await fetch('/api/v1/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                resBox.classList.remove('hidden', 'bg-red-100', 'text-red-800');
                resBox.classList.add('bg-emerald-100', 'text-emerald-800');
                resBox.innerText = `Success! Order #${data.order.id} placed for ${data.order.customer_name}.`;
                
                // Refresh table immediately after placing order
                loadOrders();
            } catch (err) {
                resBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800');
                resBox.classList.add('bg-red-100', 'text-red-800');
                resBox.innerText = 'Failed to submit order. Please try again.';
            }
        });

        loadProducts();
        loadOrders();
    </script>
</body>
</html>
